name: Build Orbit Arcade APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "icon.svg"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses and install build packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1

      - name: Generate Android project
        run: npx cap add android

      - name: Bundle the game for offline use
        run: npm run prepare:web && npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-arcade-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.0-android
          name: "مدار | Orbit Arcade 4.2.0 Android"
          body: |
            نسخة أندرويد قابلة للتثبيت من لعبة مدار (Orbit Arcade).

            - تعمل اللعبة الأساسية دون اتصال بالإنترنت.
            - نزّل ملف APK وثبّته على جهاز Android.
            - هذه نسخة تجريبية موقّعة بمفتاح Debug، وليست إصدار متجر نهائيًا.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
