<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dff4f7">
  <title>Potato Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">رفيقتك الصغيرة</p>
        <h1>Potato Pet <span>♡</span></h1>
      </div>
      <div class="coin"><span>✦</span> <b id="coins">0</b></div>
    </header>

    <section class="room" aria-label="غرفة القطة">
      <div class="window"><i></i><i></i></div>
      <div class="sun"></div>
      <div class="wall-star star-one">✦</div>
      <div class="wall-star star-two">✧</div>
      <div class="shelf"><span>♡</span><span>▱</span><span>✿</span></div>
      <div class="plant"><span></span><span></span><span></span><b></b></div>
      <div class="rug"></div>

      <div class="speech" id="speech" aria-live="polite">مياو! أهلًا بكِ ♡</div>

      <button class="pet" id="pet" type="button" aria-label="المسي القطة للتفاعل">
        <span class="tail"></span>
        <span class="ear ear-left"><i></i></span>
        <span class="ear ear-right"><i></i></span>
        <span class="body"></span>
        <span class="head">
          <i class="eye eye-left"></i>
          <i class="eye eye-right"></i>
          <i class="cheek cheek-left"></i>
          <i class="cheek cheek-right"></i>
          <i class="nose"></i>
          <i class="mouth"></i>
        </span>
        <span class="paw paw-left"></span>
        <span class="paw paw-right"></span>
      </button>

      <div class="pet-name" id="petName">لوزة</div>
      <div class="floor-line"></div>
    </section>

    <section class="status" aria-label="حالة القطة">
      <div class="status-card">
        <div><span>الشبع</span><b>🍎</b></div>
        <div class="meter"><span id="foodBar"></span></div>
      </div>
      <div class="status-card">
        <div><span>السعادة</span><b>♡</b></div>
        <div class="meter"><span id="happyBar"></span></div>
      </div>
      <div class="status-card">
        <div><span>الطاقة</span><b>☾</b></div>
        <div class="meter"><span id="energyBar"></span></div>
      </div>
    </section>

    <section class="actions" aria-label="العناية بالقطة">
      <button class="action" data-action="feed"><span>🥣</span><b>إطعام</b></button>
      <button class="action" data-action="play"><span>🧶</span><b>لعب</b></button>
      <button class="action" data-action="sleep"><span>💤</span><b>نوم</b></button>
      <button class="action" data-action="pet"><span>♡</span><b>مداعبة</b></button>
    </section>

    <footer>اضغطي على القطة لتتعرف عليكِ. هذه مجرد البداية!</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
