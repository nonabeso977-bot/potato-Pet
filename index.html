<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dff4f7">
  <title>Potato Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">رفيقتك الصغيرة</p>
        <h1>Potato Pet <span>♡</span></h1>
      </div>
      <div class="top-tools">
        <button class="tool-button" id="homeButton" type="button" aria-label="العودة إلى غرفة الجلوس">البيت <span>⌂</span></button>
        <button class="tool-button" id="lookButton" type="button" aria-label="تغيير شكل القطة">شكلها <span>✿</span></button>
        <div class="coin"><span>✦</span><b id="coins">0</b></div>
      </div>
    </header>

    <nav class="actions" aria-label="التنقل بين الغرف">
      <button class="action active" data-room="kitchen" type="button" aria-pressed="true"><span>🥣</span><b>المطبخ</b></button>
      <button class="action" data-room="playroom" type="button" aria-pressed="false"><span>🧶</span><b>غرفة اللعب</b></button>
      <button class="action" data-room="bedroom" type="button" aria-pressed="false"><span>💤</span><b>غرفة النوم</b></button>
      <button class="action" data-room="lounge" type="button" aria-pressed="false"><span>♡</span><b>غرفة الجلوس</b></button>
    </nav>

    <section class="room room-kitchen" id="room" aria-label="غرفة القطة">
      <div class="room-label" id="roomName">المطبخ</div>
      <div class="room-illustration" id="roomIllustration" aria-hidden="true">🍳</div>
      <div class="window"><i></i><i></i></div>
      <div class="sun"></div>
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>
      <div class="wall-star star-one">✦</div>
      <div class="wall-star star-two">✧</div>
      <div class="shelf"><span>♡</span><span>▱</span><span>✿</span></div>
      <div class="plant"><span></span><span></span><span></span><b></b></div>
      <div class="rug"></div>
      <div class="speech" id="speech" aria-live="polite">مياو! جعت؟ ♡</div>
      <button class="room-action" id="roomAction" type="button">قدّمي لها الطعام 🍎</button>

      <button class="pet skin-blue" id="pet" type="button" aria-label="المسي القطة للتفاعل">
        <span class="tail"></span>
        <span class="ear ear-left"><i></i></span>
        <span class="ear ear-right"><i></i></span>
        <span class="body"><i class="belly"></i></span>
        <span class="head">
          <i class="patch"></i>
          <i class="eye eye-left"><b></b></i>
          <i class="eye eye-right"><b></b></i>
          <i class="cheek cheek-left"></i>
          <i class="cheek cheek-right"></i>
          <i class="whisker whisker-left"></i>
          <i class="whisker whisker-right"></i>
          <i class="nose"></i>
          <i class="mouth"></i>
        </span>
        <span class="paw paw-left"></span>
        <span class="paw paw-right"></span>
      </button>

      <div class="pet-name" id="petName">لوزة</div>
      <div class="floor-line"></div>
    </section>

    <section class="status" aria-label="حالة القطة">
      <div class="status-card">
        <div><span>الشبع</span><b>🍎</b></div>
        <div class="meter"><span id="foodBar"></span></div>
      </div>
      <div class="status-card">
        <div><span>السعادة</span><b>♡</b></div>
        <div class="meter"><span id="happyBar"></span></div>
      </div>
      <div class="status-card">
        <div><span>الطاقة</span><b>☾</b></div>
        <div class="meter"><span id="energyBar"></span></div>
      </div>
    </section>
    <footer>اختاري غرفة من الأعلى، ثم تفاعلي مع لوزة ♡</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
